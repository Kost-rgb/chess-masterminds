<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Attacking Masterminds</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --panel: #21262d;
      --card: #0f1723;
      --text: #f0f6fc;
      --muted: #c9d1d9;
      --button: #f6f8fa;
      --button-text: #0d1117;
      --border: rgba(240, 246, 252, 0.12);
      --shadow: rgba(0, 0, 0, 0.45);
      --accent: #58a6ff;
      --glow: rgba(255, 255, 255, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      background: var(--bg);
    }

    .page {
      width: 100vw;
      min-height: 100vh;
      padding: clamp(18px, 3vw, 40px);
      background: linear-gradient(180deg, rgba(13,17,23,0.98), rgba(22,27,34,0.96));
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    .header {
      text-align: center;
      margin-bottom: clamp(20px, 4vw, 42px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 4rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.15;
      text-transform: uppercase;
      color: #ffffff;
    }

    .button-list {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(12px, 2vw, 26px);
      justify-content: center;
      margin-bottom: clamp(20px, 3vw, 28px);
    }

    .button-wrapper {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mastermind-btn {
      position: relative;
      appearance: none;
      border: 1px solid rgba(0,0,0,0.15);
      background: var(--button);
      color: var(--button-text);
      border-radius: 12px;
      padding: clamp(12px, 1.6vw, 18px) clamp(20px, 3vw, 28px);
      font-size: clamp(0.9rem, 1.3vw, 1.1rem);
      font-weight: 700;
      line-height: 1.25;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(255, 255, 255, 0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      width: 100%;
      text-align: center;
    }

    .mastermind-btn:hover,
    .mastermind-btn:focus-visible {
      transform: scale(1.05);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.2), 0 0 22px var(--glow);
      filter: brightness(1.05);
    }

    .arrow-btn {
      border: none;
      background: transparent;
      color: var(--text);
      width: clamp(40px, 5vw, 60px);
      height: clamp(40px, 5vw, 60px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      margin-top: clamp(8px, 1.5vw, 12px);
      pointer-events: none;
    }

    .button-wrapper:hover .arrow-btn,
    .arrow-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .arrow-btn:hover,
    .arrow-btn:focus-visible {
      transform: scale(1.15);
    }

    .arrow-icon {
      width: 0;
      height: 0;
      border-left: clamp(10px, 1.2vw, 16px) solid transparent;
      border-right: clamp(10px, 1.2vw, 16px) solid transparent;
      border-top: clamp(12px, 1.8vw, 18px) solid #ffffff;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
    }

    .arrow-btn.open .arrow-icon {
      transform: rotate(180deg);
    }

    .info-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.45s ease, opacity 0.3s ease, margin-top 0.3s ease;
      margin-top: 0;
      width: min(1100px, calc(100vw - 32px));
      margin-inline: auto;
    }

    .info-panel.open {
      max-height: 900px;
      opacity: 1;
      margin-top: 20px;
    }

    .panel-inner {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(220px, 0.7fr);
      gap: clamp(18px, 3vw, 30px);
      align-items: center;
      background: rgba(33, 38, 45, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: clamp(18px, 2.8vw, 30px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.25);
    }

    .panel-text h2 {
      margin: 0 0 12px 0;
      font-size: clamp(1.5rem, 2vw, 2.4rem);
      line-height: 1.2;
    }

    .panel-text p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.2vw, 1.1rem);
      line-height: 1.7;
    }

    .panel-image {
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #1f2937, #0f172a);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 760px) {
      .page {
        padding: 18px 14px;
      }

      .panel-inner {
        grid-template-columns: 1fr;
      }

      .button-list {
        flex-direction: column;
        align-items: stretch;
      }

      .button-wrapper {
        max-width: 100%;
      }

      .mastermind-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>TOP ATTACKING MASTERMINDS</h1>
    </header>

    <div class="button-list">
      <div class="button-wrapper">
        <button class="mastermind-btn" data-name="Mikhail Nekhemyevich Tal" data-description="Mikhail Botvinnik? No—Tal was the brilliant attacking magician of the 20th century, famous for uncompromising initiative, tactical explosions, and daring sacrifices." data-image="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80">
          Mikhail Nekhemyevich Tal
        </button>
        <button class="arrow-btn" aria-label="Open player details" aria-expanded="false">
          <span class="arrow-icon"></span>
        </button>
      </div>

      <div class="button-wrapper">
        <button class="mastermind-btn" data-name="Paul Charles Morphy" data-description="Morphy combined lightning calculation, strategic clarity, and devastating attacking play. He was a master of transforming slight advantages into overwhelming attacks." data-image="https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=900&q=80">
          Paul Charles Morphy
        </button>
        <button class="arrow-btn" aria-label="Open player details" aria-expanded="false">
          <span class="arrow-icon"></span>
        </button>
      </div>

      <div class="button-wrapper">
        <button class="mastermind-btn" data-name="Karl Ernst Adolf Anderssen" data-description="Anderssen's games are celebrated for imagination and attacking beauty. He was a romantic master whose sacrifices and tactical vision set the benchmark for attacking chess." data-image="https://images.unsplash.com/photo-1504593811423-6dd665756598?auto=format&fit=crop&w=900&q=80">
          Karl Ernst Adolf Anderssen
        </button>
        <button class="arrow-btn" aria-label="Open player details" aria-expanded="false">
          <span class="arrow-icon"></span>
        </button>
      </div>
    </div>

    <section class="info-panel" id="infoPanel">
      <div class="panel-inner">
        <div class="panel-text">
          <h2 id="panelTitle">Mikhail Nekhemyevich Tal</h2>
          <p id="panelText">
            Mikhail Botvinnik? No—Tal was the brilliant attacking magician of the 20th century, famous for uncompromising initiative, tactical explosions, and daring sacrifices.
          </p>
        </div>
        <div class="panel-image">
          <img id="panelImage" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80" alt="Chess Mastermind" />
        </div>
      </div>
    </section>
  </div>

  <script>
    const buttonWrappers = document.querySelectorAll('.button-wrapper');
    const panel = document.getElementById('infoPanel');
    const panelTitle = document.getElementById('panelTitle');
    const panelText = document.getElementById('panelText');
    const panelImage = document.getElementById('panelImage');

    function updatePanel(name, description, image) {
      panelTitle.textContent = name;
      panelText.textContent = description;
      panelImage.src = image;
      panelImage.alt = name;
    }

    buttonWrappers.forEach(wrapper => {
      const mastermindBtn = wrapper.querySelector('.mastermind-btn');
      const arrowBtn = wrapper.querySelector('.arrow-btn');

      const togglePanel = () => {
        const isOpen = panel.classList.toggle('open');
        arrowBtn.classList.toggle('open', isOpen);
        arrowBtn.setAttribute('aria-expanded', String(isOpen));

        updatePanel(
          mastermindBtn.dataset.name,
          mastermindBtn.dataset.description,
          mastermindBtn.dataset.image
        );
      };

      mastermindBtn.addEventListener('click', togglePanel);
      arrowBtn.addEventListener('click', togglePanel);

      wrapper.addEventListener('mouseenter', () => {
        arrowBtn.classList.add('visible');
      });

      wrapper.addEventListener('mouseleave', () => {
        arrowBtn.classList.remove('visible');
      });
    });
  </script>
</body>
</html>
